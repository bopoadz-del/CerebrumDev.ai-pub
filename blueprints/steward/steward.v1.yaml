schema_version: product_blueprint.v1
product_id: projectsix
product_name: Cerebrum Steward
vertical: estate
serves_verticals: [estate]
canonical_output: Projectsix
summary: >
  Remote Asset & Estate Operations Platform — generated by CerebrumDev.ai Factory
  from the private_estate_operations kit and dual-registered Store blocks.
  Multi-property / multi-country registry, House Manual SOP engine, vendor & budget,
  preventive maintenance, household staff scheduling, principal dashboard,
  new-property onboarding, and dual RAG (SOP corpus + estate documents).
  Smart-home/IoT connectors are honest placeholders only.
factory_scenario: CREATE_PRODUCT
capabilities:
  # --- Core estate kit (REUSE) ---
  - id: estate_registry
    description: >
      Multi-property, multi-country property & asset registry with ownership
      boundaries, validation, and durable storage.
    block_ids: [estate_registry, database, storage, validation]
    strategy_hint: COMPOSE
  - id: estate_maintenance
    description: Maintenance schedules and work-order intelligence from the asset register
    block_ids: [estate_maintenance]
    strategy_hint: REUSE
  - id: evidence_verifier
    description: Verify operational evidence without leaking PII into learning
    block_ids: [evidence_verifier]
    strategy_hint: REUSE
  - id: readiness_engine
    description: Property readiness gates before guest or staff activation
    block_ids: [readiness_engine]
    strategy_hint: REUSE
  - id: portfolio_rollup
    description: Roll up readiness and maintenance signals across the estate portfolio
    block_ids: [portfolio_rollup]
    strategy_hint: REUSE

  # --- House Manual / SOP engine ---
  - id: house_manual_sop
    description: >
      Per-property + global House Manual / SOP engine — versioned standards corpus
      indexed for dual RAG Layer 1.
    block_ids: [document_engine, knowledge, vector_search]
    strategy_hint: COMPOSE

  # --- Vendor & budget ---
  - id: vendor_budget
    description: >
      Vendor contracts, rates, spend tracking, and renegotiation flags with audit trail.
    block_ids: [formula_executor, audit, notification]
    strategy_hint: COMPOSE

  # --- Preventive maintenance loop ---
  - id: preventive_maintenance
    description: >
      Asset register → maintenance calendar → work orders → escalation via workflow bus.
    block_ids: [estate_maintenance, workflow, event_bus, queue]
    strategy_hint: COMPOSE

  # --- Household staff ---
  - id: staff_scheduling
    description: >
      Household staff scheduling & task management for teams of 10+ — shifts,
      assignments, performance notes.
    block_ids: [workflow, team, notification]
    strategy_hint: COMPOSE

  # --- Principal dashboard ---
  - id: principal_dashboard
    description: >
      Principal portfolio health, delivery status, and escalation paths —
      no surprises reach the principal.
    block_ids: [dashboard, analytics, portfolio_rollup]
    strategy_hint: COMPOSE

  # --- New-property onboarding ---
  - id: property_onboarding
    description: >
      Template-driven new-property onboarding — apply the estate framework to a new asset.
    block_ids: [spec_analyzer, recommendation_template, readiness_engine]
    strategy_hint: COMPOSE

  # --- Dual RAG ---
  - id: dual_rag_sop
    description: >
      Dual RAG Layer 1 — SOP / House Manual / global standards corpus (separately indexed).
    block_ids: [knowledge, vector_search, document_engine]
    strategy_hint: COMPOSE
  - id: dual_rag_estate_docs
    description: >
      Dual RAG Layer 2 — the estate's own documents, separately indexed from SOP corpus.
    block_ids: [knowledge, vector_search, document_engine]
    strategy_hint: COMPOSE

  # --- Composed loops (retained) ---
  - id: composed_ops_loop
    description: Compose registry + maintenance + readiness into an ops loop
    block_ids: [estate_registry, estate_maintenance, readiness_engine]
    strategy_hint: COMPOSE
  - id: evidence_capture
    description: Capture supporting evidence artifacts
    block_ids: [capture, evidence_verifier]
    strategy_hint: COMPOSE
  - id: human_authority_gate
    description: Human authority confirmation surface (kernel GENERATE)
    block_ids: []
    strategy_hint: GENERATE

ui_modules:
  - command_center
  - principal_dashboard
  - estate_registry
  - house_manual
  - maintenance
  - vendors
  - staff
  - readiness
  - onboarding
  - portfolio
  - evidence
  - dual_rag
  - operational_chat
  - resident_engineer

connectors:
  - cmms_stub
  - iot_stub
  - document_vault_stub
  - smart_home_placeholder
  # Honest placeholders only — no live IoT credentials or device control.

edge_profile: edge_on_prem
human_authority: true
