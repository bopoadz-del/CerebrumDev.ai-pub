# Incremental typecheck — do not try to make the whole tree strict-clean.
#
# Scope (this is the ratchet):
#   app/core/cors_policy.py   — CORS allowlist (this PR)
#   app/core/metrics.py       — Prometheus /metrics payload (this PR)
#   app/core/session_guard.py — small, already typed ownership helper
#   app/core/observability.py — Sentry bootstrap
#
# NEW files: HTTP / ops helpers added under app/core/ must be listed here
# once they exist, and this CI job must stay green on that list. Do not add
# factory/session god-files until they are driven to zero errors on their own.
#
# Expand: pick one module, drive `mypy` to zero on it, append it to files=.
# follow_imports=silent keeps the rest of the tree from becoming this job.

[mypy]
python_version = 3.11
pretty = True
show_error_codes = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
disallow_untyped_defs = True
files =
    app/core/cors_policy.py,
    app/core/metrics.py,
    app/core/session_guard.py,
    app/core/observability.py

[mypy-prometheus_client.*]
ignore_missing_imports = True

[mypy-sentry_sdk.*]
ignore_missing_imports = True
