# Gate replay (owner rule, 2026-10-08): a change to the gate is judged against
# the builds it already certified, BEFORE merge. A gate that fails a
# previously certified export is a gate defect until proven a product defect.
#
# Route A (owner order, 2026-10-13): the replay runs HERE, on the Factory at
# the PR head (a local checkout), where the Factory code already is -- no job
# reads another repository and no secret is used, only this workflow's default
# GITHUB_TOKEN. That token cannot read the private cerebrum-builds (probe
# #738: HTTP 404, "Repository not found"), so what the replay consumes from
# there is HANDED OVER and vendored under .github/gate_replay/vendor/<builds
# commit>/ (cerebrum-builds .github/gate_handover/): the gate byte for byte
# (store_gate/ incl. replay_select.py, replay_flips.py, known_bad_fixtures.json,
# revoked_certifications.json; store-gate.yml), the selection the gate's own
# record made, and each selected build's tree pinned by its git tree id.
# .github/gate_replay/replay_in_factory.py verifies it against its manifest
# before every use.
#
# The jobs are cerebrum-builds' gate-replay.yml for a Factory change:
# select -> render this Factory's files onto each build -> the Store gate
# (gate-replay-store-gate.yml: store-gate.yml with its two fetches read from
# the handover) -> route each result through this Factory's ingest rule ->
# verdict, by the vendored replay_flips.py: every certified build still
# certifies AND every known-bad fixture still fails on its expected check.
#
# The paths below are every module the gate's Factory half is made of: the
# stamp registry, the ingest rule, the acceptance floor and the replay itself,
# plus the modules they import from app.factory.build (enforced by
# tests/factory/test_gate_replay.py, which derives the set from the imports).

name: Gate replay
run-name: ${{ inputs.sha && format('gate replay {0}', inputs.sha) || 'gate replay' }}

on:
  # On demand for a named commit: a PR that touches no gate module gets no
  # automatic replay, and the merge rule still asks for one.
  workflow_dispatch:
    inputs:
      sha:
        description: "The commit whose gate is replayed on the newest certified builds"
        required: true
  pull_request:
    paths:
      - ".github/workflows/gate-replay.yml"
      - ".github/gate_replay.json"
      - ".github/gate_replay/**"
      - ".github/workflows/gate-replay-store-gate.yml"
      - "backend/requirements-replay.txt"
      - "backend/app/factory/acceptance_floor.v2.json"
      - "backend/app/factory/build/acceptance_floor.py"
      - "backend/app/factory/build/authority.py"
      - "backend/app/factory/build/authorship.py"
      - "backend/app/factory/build/block_obligations.py"
      - "backend/app/factory/build/branch_attach.py"
      - "backend/app/factory/build/build_level.py"
      - "backend/app/factory/build/builds_push.py"
      - "backend/app/factory/build/concurrency_floor.py"
      - "backend/app/factory/build/data_lifecycle.py"
      - "backend/app/factory/build/dependency_pins.py"
      - "backend/app/factory/build/deploy.py"
      - "backend/app/factory/build/deploy_time_settings.py"
      - "backend/app/factory/build/domain_acceptance.py"
      - "backend/app/factory/build/entity_contract.py"
      - "backend/app/factory/build/factory_block.py"
      - "backend/app/factory/build/factory_receipt.py"
      - "backend/app/factory/build/factory_refresh.py"
      - "backend/app/factory/build/failure_owner.py"
      - "backend/app/factory/build/gate_replay.py"
      - "backend/app/factory/build/gates.py"
      - "backend/app/factory/build/kernel_publish.py"
      - "backend/app/factory/build/ledger.py"
      - "backend/app/factory/build/level_grade.py"
      - "backend/app/factory/build/money_contract.py"
      - "backend/app/factory/build/n3_store_gate.py"
      - "backend/app/factory/build/orphan_recovery.py"
      - "backend/app/factory/build/package.py"
      - "backend/app/factory/build/payload_helpers.py"
      - "backend/app/factory/build/placeholder_connectors.py"
      - "backend/app/factory/build/platform_identity.py"
      - "backend/app/factory/build/product_gate.py"
      - "backend/app/factory/build/product_suites.py"
      - "backend/app/factory/build/rejection_contract.py"
      - "backend/app/factory/build/roles_constants.py"
      - "backend/app/factory/build/roles_handlers.py"
      - "backend/app/factory/build/stamp_registry.py"
      - "backend/app/factory/build/store_acceptance.py"
      - "backend/app/factory/build/writer_behaviour.py"
      - "backend/app/factory/build/writer_phases.py"

permissions:
  contents: read

env:
  # The Factory under replay: the PR head, or the commit named on demand.
  FACTORY_REF: ${{ inputs.sha || github.event.pull_request.head.sha }}

jobs:
  select:
    name: select certified builds (handover)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FACTORY_REF }}
          persist-credentials: false
      - name: The vendored handover is its manifest
        run: python3 .github/gate_replay/replay_in_factory.py verify
      - id: pick
        name: Select by the vendored replay_select.py on the handed-over record
        run: python3 .github/gate_replay/replay_in_factory.py select --out selection.json
      - uses: actions/upload-artifact@v4
        with:
          name: replay-selection
          path: selection.json

  render:
    name: render the Factory under replay (${{ matrix.label }})
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FACTORY_REF }}
          path: factory
          persist-credentials: false
      - name: Restore the build from the handover
        env:
          PRODUCT_SHA: ${{ matrix.sha }}
        run: python3 factory/.github/gate_replay/replay_in_factory.py extract "$PRODUCT_SHA" product
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet -r factory/backend/requirements-replay.txt
      - name: Re-render the Factory's files onto the certified build
        working-directory: factory/backend
        env:
          PYTHONPATH: .
        run: python -m app.factory.build.gate_replay render "$GITHUB_WORKSPACE/product" --changed "$GITHUB_WORKSPACE/changed.txt"
      - name: Collect the re-rendered files
        run: |
          set -euo pipefail
          mkdir -p overlay
          touch overlay/.gate-replay-overlay
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            mkdir -p "overlay/$(dirname "$rel")"
            cp "product/$rel" "overlay/$rel"
          done < changed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: overlay-${{ matrix.label }}
          path: overlay/
          include-hidden-files: true

  replay:
    name: replay (${{ matrix.label }})
    needs: [select, render]
    if: ${{ always() && needs.select.result == 'success' && needs.render.result == 'success' }}
    permissions:
      contents: read
      # The vendored gate pulls its Postgres and the products' base images
      # from the account's ghcr mirror with the built-in token, falling back
      # to public mirrors (base_images.py).
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    uses: ./.github/workflows/gate-replay-store-gate.yml
    with:
      product_sha: ${{ matrix.sha }}
      replay_label: ${{ matrix.label }}
      overlay_artifact: ${{ format('overlay-{0}', matrix.label) }}
      # (the workflow env is not readable in a reusable call's inputs)
      factory_ref: ${{ inputs.sha || github.event.pull_request.head.sha }}

  route:
    name: route through the Factory under replay (${{ matrix.label }})
    needs: [select, replay]
    if: ${{ always() && needs.select.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FACTORY_REF }}
          path: factory
          persist-credentials: false
      - name: Restore the build from the handover
        env:
          PRODUCT_SHA: ${{ matrix.sha }}
        run: python3 factory/.github/gate_replay/replay_in_factory.py extract "$PRODUCT_SHA" product
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: overlay-${{ matrix.label }}
          path: product
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gate-replay-${{ matrix.label }}
          path: result
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet -r factory/backend/requirements-replay.txt
      - name: Route the replayed result through the Factory's ingest rule
        working-directory: factory/backend
        env:
          PYTHONPATH: .
          BRANCH: ${{ matrix.branch }}
          LABEL: ${{ matrix.label }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/routing"
          python -m app.factory.build.gate_replay verdict "$GITHUB_WORKSPACE/product" \
            "$GITHUB_WORKSPACE/result/store_gate.json" --branch "$BRANCH" \
            --out "$GITHUB_WORKSPACE/routing/$LABEL.json"
      - uses: actions/upload-artifact@v4
        with:
          name: routing-${{ matrix.label }}
          path: routing/

  verdict:
    # The PR check. Fails when any certified build no longer passes, or any
    # known-bad build is no longer caught on its expected check.
    name: gate replay (certified builds)
    needs: [select, render, replay, route]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FACTORY_REF }}
          persist-credentials: false
      - name: The selection must have run
        if: ${{ needs.select.result != 'success' }}
        run: |
          echo "no certified build was selected (select: ${{ needs.select.result }}): the gate change cannot be replayed"
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: replay-selection
          path: .
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: gate-replay-*
          path: results
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: routing-*
          path: routing
          merge-multiple: true
      - name: Compare with the certified results (the vendored replay_flips.py, as is)
        run: |
          set -euo pipefail
          python3 .github/gate_replay/replay_in_factory.py verify
          count=$(python3 -c "import json; print(len(json.load(open('selection.json'))))")
          if [ "$count" -eq 0 ]; then
            # Not-applicable ONLY when the handover is truly empty (0 entries).
            # A non-empty handover that selected 0 certified builds is a failure.
            total=$(python3 -c "import sys; sys.path.insert(0, '.github/gate_replay'); import replay_in_factory as r; print(len(r.manifest().get('selection') or []))")
            if [ "$total" -eq 0 ]; then
              echo "::notice title=gate replay::not applicable: the certified handover is empty (0 entries); nothing to replay"
              exit 0
            fi
            echo "::error title=gate replay::non-empty handover selected 0 certified builds; the gate stays strict"
            exit 1
          fi
          VENDOR=$(python3 .github/gate_replay/replay_in_factory.py vendor-dir)
          python3 "$VENDOR"/gate/.github/store_gate/replay_flips.py selection.json results --routing routing
