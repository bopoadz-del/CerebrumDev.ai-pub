name: Dependabot auto-merge

# Grouped Dependabot bumps that are PATCH or MINOR are queued for auto-merge with
# `gh pr merge --auto`: GitHub merges them ONLY after every required CI check in
# ci.yml has passed. A MAJOR bump is a behaviour change wearing a version number
# -- it is never auto-armed and always needs a human review + merge.
#
# FAIL-CLOSED (2026-11-02, ORDERS_1024Z/1040Z/1131Z): a grouped patch/minor bump
# auto-merged RED to master. Root cause: `--auto` waits for the *required* checks,
# but master had NO branch protection, so there were none to wait on and GitHub
# merged immediately -- past a red suite. The guard below refuses to arm unless the
# base branch actually has required status checks for --auto to gate on. A lock
# twin is already enforced by the required "Lockfile consistency" check, so a
# second workflow-level lock guard here would be redundant and is intentionally
# NOT added -- it would also make this pull_request_target job inspect PR file
# paths, which the design forbids (see the test that asserts exactly that).
#
# pull_request_target runs with a token against the BASE commit; this workflow
# never checks out, builds, or executes any code from the pull request, and never
# reads the PR tree. It reads bump metadata and the base branch's protection only.
# Do not add `actions/checkout` with a PR ref, and never replace `--auto` (which
# waits for the required checks) with a bare or `--admin` merge.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Dependabot auto-merge (patch/minor, grouped)
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the bump's metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # FAIL-CLOSED GUARD -- the base branch MUST carry branch protection with at
      # least one required status check. Without it, `gh pr merge --auto` has
      # nothing to wait on and merges IMMEDIATELY (that is how a red group reached
      # master). If protection/required-checks are absent OR the token cannot read
      # them, ok=false and we DO NOT arm (erring toward a human merge is safe).
      - name: Require branch protection with required checks on the base
        id: protection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base='${{ github.event.pull_request.base.ref }}'
          repo='${{ github.repository }}'
          count=$(gh api "repos/$repo/branches/$base/protection/required_status_checks" \
                    --jq '((.contexts // []) + ((.checks // []) | map(.context))) | unique | length' \
                    2>/dev/null || echo 0)
          count=${count:-0}
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ge 1 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      # Patch + minor (grouped bumps report the group's highest semver change here)
      # arm the native merge queue ONLY when the guard passes. --auto then holds the
      # PR until every required ci.yml check is green; it never bypasses them.
      - name: Arm auto-merge for patch and minor
        if: >-
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor') &&
          steps.protection.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
          echo "::notice title=Auto-merge armed::Patch/minor bump queued behind required CI checks."

      # Fail-closed: a patch/minor bump whose base has no required checks -- a human
      # reviews and merges after CI is green, because --auto would otherwise merge
      # ungated.
      - name: Not armed -- base has no required checks
        if: >-
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor') &&
          steps.protection.outputs.ok != 'true'
        run: |
          echo "::warning title=Auto-merge NOT armed (fail-closed)::base '${{ github.event.pull_request.base.ref }}' has no required status checks (count=${{ steps.protection.outputs.count }}); --auto would merge ungated. Review and merge by hand once CI is green."

      # A major bump is never auto-armed: a human reviews and merges it.
      - name: Major bump needs human review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "::notice title=Review required::Major bump -- auto-merge NOT armed. Review and merge by hand; required CI checks still apply."
