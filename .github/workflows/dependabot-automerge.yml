name: Dependabot auto-merge (disabled)

# Auto-merge to the default branch is OFF. A green Dependabot PR is NOT
# merged automatically; a human reviews and merges every bump by hand.
#
# This workflow used to arm `gh pr merge --auto` for patch/minor bumps. That
# arming step was removed so no dependency bump reaches master without a
# human clicking merge. The job is kept only to post a clear notice on each
# Dependabot PR; required CI checks in ci.yml still gate the PR as before.
#
# pull_request_target runs with a token against the BASE commit; this
# workflow never checks out, builds, or executes any code from the pull
# request — it reads metadata and writes log notices only. Do not add
# `actions/checkout` here without a `ref:` you control, and do not re-add
# `gh pr merge --auto`.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review-required:
    name: Require human review (auto-merge disabled)
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the bump's metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Say auto-merge is off
        run: |
          echo "package      : ${{ steps.meta.outputs.dependency-names }}"
          echo "update type  : ${{ steps.meta.outputs.update-type }}"
          echo "ecosystem    : ${{ steps.meta.outputs.package-ecosystem }}"
          echo "::notice title=Auto-merge disabled::This Dependabot PR will NOT merge automatically. Review and merge it by hand; required CI checks still apply."
