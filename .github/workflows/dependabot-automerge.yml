name: Dependabot auto-merge

# Grouped Dependabot bumps that are PATCH or MINOR are queued for auto-merge with
# `gh pr merge --auto`: GitHub merges them ONLY after every required CI check in
# ci.yml has passed. A MAJOR bump is a behaviour change wearing a version number
# -- it is never auto-armed and always needs a human review + merge.
#
# (Re-armed 2026-10-27, ORDERS_0400Z: the earlier temporary stop is lifted now
# that the finish-line CI debt is cleared. Grouped, patch+minor only.)
#
# pull_request_target runs with a token against the BASE commit; this workflow
# never checks out, builds, or executes any code from the pull request, and never
# reads the PR tree (no requirements.* inspection) -- it reads bump metadata and
# arms the native merge queue only. Do not add `actions/checkout` with a PR ref,
# and never replace `--auto` (which waits for the required checks) with a bare or
# `--admin` merge (which would bypass them).

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Dependabot auto-merge (patch/minor, grouped)
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the bump's metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Patch + minor (grouped bumps report the group's highest semver change
      # here) arm the native merge queue. --auto holds the PR until every
      # required ci.yml check is green; it never bypasses them.
      - name: Arm auto-merge for patch and minor
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
          echo "::notice title=Auto-merge armed::Patch/minor bump queued behind required CI checks."

      # A major bump is never auto-armed: a human reviews and merges it.
      - name: Major bump needs human review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "::notice title=Review required::Major bump -- auto-merge NOT armed. Review and merge by hand; required CI checks still apply."
