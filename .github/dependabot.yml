version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bump vite and the React plugin together so majors (vite 8 /
      # @vitejs/plugin-react 6) do not land as separately-conflicting PRs.
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
